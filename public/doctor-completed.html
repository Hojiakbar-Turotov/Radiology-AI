<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vrach Ko'rgan Bemorlar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    }
    body {
      background: #0b1329;
      color: #f1f5f9;
      padding: 18px 22px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Tepa qism: Shifokor ma'lumotlari va statistikasi */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(59, 130, 246, 0.25);
      margin-bottom: 14px;
    }
    .doctor-info-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .room-badge {
      background: #2563eb;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }
    .doctor-name-title {
      font-size: 18px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: 0.3px;
    }
    .date-label {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
      margin-top: 2px;
    }

    /* Statistika chiplari */
    .stats-pills-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }
    .pill-total {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.45);
    }
    .pill-today {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.45);
    }
    .pill-earlier {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.45);
    }

    /* Qidiruv va saralash vositalari */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
      max-width: 480px;
    }
    .search-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px;
      padding: 8px 36px 8px 34px;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: #94a3b8;
      pointer-events: none;
    }
    .clear-search-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      display: none;
    }

    .filter-options {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-btn {
      background: #1e293b;
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
    }
    .btn-print {
      background: #0f766e;
      border: 1px solid #14b8a6;
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Jadval konteyneri */
    .table-container {
      flex: 1;
      background: #111c38;
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 12px;
      overflow-y: auto;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }
    thead {
      position: sticky;
      top: 0;
      background: #1e3a8a;
      z-index: 10;
    }
    th {
      padding: 12px 14px;
      color: #e2e8f0;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      font-size: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    td {
      padding: 11px 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      color: #f1f5f9;
      vertical-align: middle;
    }
    tbody tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }
    tbody tr:hover {
      background: rgba(59, 130, 246, 0.12);
    }

    /* Nishonlar */
    .badge-idx {
      display: inline-block;
      min-width: 24px;
      text-align: center;
      font-weight: 800;
      color: #94a3b8;
    }
    .badge-id {
      font-weight: 800;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .patient-name {
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.2px;
    }
    .refer-doc {
      color: #cbd5e1;
      font-size: 12.5px;
    }
    .time-cell {
      color: #94a3b8;
      font-size: 12.5px;
      white-space: nowrap;
    }
    .tag-completed {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    .tag-earlier-completed {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.45);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Bo'sh holat */
    .empty-state {
      text-align: center;
      padding: 45px 20px;
      color: #94a3b8;
      font-size: 15px;
    }
    .empty-icon {
      font-size: 36px;
      margin-bottom: 10px;
      display: block;
    }

    /* Chop etish uslublari */
    @media print {
      body { background: #fff; color: #000; padding: 10px; }
      .controls-row, .btn-print { display: none !important; }
      .table-container { background: #fff; border: 1px solid #ccc; box-shadow: none; }
      th { background: #eee; color: #000; }
      td { color: #000; border-bottom: 1px solid #ddd; }
      .badge-id { background: transparent; color: #000; border: 1px solid #ccc; }
      .room-badge { background: #000; color: #fff; }
      .tag-completed, .tag-earlier-completed { background: transparent; color: #000; border: 1px solid #999; }
    }
  </style>
</head>
<body>

  <!-- Hujjat sarlavhasi -->
  <div class="header-bar">
    <div class="doctor-info-wrap">
      <div class="room-badge" id="dispRoomBadge">XONA</div>
      <div>
        <div class="doctor-name-title" id="dispDoctorName">Shifokor Ko'rgan Bemorlar</div>
        <div class="date-label" id="dispDateLabel">Bugun tasdiqlangan ko'riklar</div>
      </div>
    </div>
    <div class="stats-pills-row">
      <div class="pill pill-total" id="statPillTotal">✅ Jami: 0 ta</div>
      <div class="pill pill-today" id="statPillToday">📅 Bugun ro'yxat: 0 ta</div>
      <div class="pill pill-earlier" id="statPillEarlier">🔄 Oldin yo'naltirilgan: 0 ta</div>
    </div>
  </div>

  <!-- Qidiruv va filtrlash boshqaruvi -->
  <div class="controls-row">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Bemor ID, F.I.Sh. yoki yo'naltiruvchi shifokor..." />
      <button type="button" id="clearSearchBtn" class="clear-search-btn" title="Tozalash">✕</button>
    </div>
    <div class="filter-options">
      <button type="button" class="filter-btn active" data-filter="all" id="btnFilterAll">Barchasi</button>
      <button type="button" class="filter-btn" data-filter="today" id="btnFilterToday">Bugun yo'naltirilgan</button>
      <button type="button" class="filter-btn" data-filter="earlier" id="btnFilterEarlier">Oldin yo'naltirilgan</button>
      <button type="button" class="btn-print" id="btnPrint" title="Chop etish">🖨️ Chop etish</button>
    </div>
  </div>

  <!-- Bemorlar jadvali -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 45px; text-align: center;">#</th>
          <th style="width: 110px;">Bemor ID</th>
          <th>Bemor F.I.Sh.</th>
          <th>Yo'naltiruvchi Shifokor</th>
          <th>Ro'yxatga Olingan</th>
          <th>Tasdiqlangan Sana</th>
          <th>Holati</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="7" class="empty-state">
            <span class="empty-icon">⏳</span>
            Ma'lumotlar yuklanmoqda...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      let targetRoom = urlParams.get('room') || urlParams.get('id') || '';
      if (!targetRoom && window.location.hash) {
        targetRoom = window.location.hash.replace('#', '');
      }

      let allCompletedPatients = [];
      let currentFilter = 'all';
      let currentQuery = '';

      const dispRoomBadge = document.getElementById('dispRoomBadge');
      const dispDoctorName = document.getElementById('dispDoctorName');
      const dispDateLabel = document.getElementById('dispDateLabel');
      const statPillTotal = document.getElementById('statPillTotal');
      const statPillToday = document.getElementById('statPillToday');
      const statPillEarlier = document.getElementById('statPillEarlier');
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      const tableBody = document.getElementById('tableBody');
      const btnPrint = document.getElementById('btnPrint');

      // Bugungi sana formatlash
      const now = new Date();
      const pad = n => (n < 10 ? '0' : '') + n;
      const todayStr = `${pad(now.getDate())}.${pad(now.getMonth() + 1)}.${now.getFullYear()}`;
      dispDateLabel.textContent = `📅 Bugun: ${todayStr} da tasdiqlangan ko'riklar`;

      // 1. Ma'lumotlarni yuklash (Parent window dan yoki API dan)
      function loadData() {
        // A. Agar parent oynada queueData bo'lsa darhol o'qish (0ms kechikish)
        if (window.parent && window.parent.queueData) {
          applyDataFromQueue(window.parent.queueData);
          return;
        }

        // B. API orqali yuklash
        fetch('/api/queue-live?t=' + Date.now())
          .then(res => res.json())
          .then(data => {
            applyDataFromQueue(data);
          })
          .catch(err => {
            console.error('Yuklashda xato:', err);
            // Zaxira endpoint
            fetch('/api/doctor-completed-patients?room=' + encodeURIComponent(targetRoom))
              .then(res => res.json())
              .then(resData => {
                if (resData && resData.patients) {
                  allCompletedPatients = resData.patients;
                  if (dispDoctorName) dispDoctorName.textContent = resData.doctorName || targetRoom;
                  if (dispRoomBadge) dispRoomBadge.textContent = resData.room || targetRoom;
                  updateStats();
                  renderTable();
                }
              })
              .catch(() => {
                tableBody.innerHTML = `<tr><td colspan="7" class="empty-state"><span class="empty-icon">⚠️</span>Ma'lumotlarni yuklashda xatolik yuz berdi.</td></tr>`;
              });
          });
      }

      function applyDataFromQueue(qData) {
        if (!qData || !qData.doctors) return;

        let doc = qData.doctors.find(d => (d.id === targetRoom || d.room === targetRoom));
        if (!doc) {
          doc = qData.doctors.find(d => 
            (d.room && d.room.toLowerCase().includes(String(targetRoom).toLowerCase())) ||
            String(d.num) === String(targetRoom)
          );
        }

        if (doc) {
          dispRoomBadge.textContent = doc.room ? doc.room.replace('Ultratovush-', 'U-') : targetRoom;
          dispDoctorName.textContent = `${doc.room || targetRoom} — ${doc.doctorName || 'Shifokor'}`;
          
          if (doc.completedPatients && Array.isArray(doc.completedPatients)) {
            allCompletedPatients = doc.completedPatients;
          } else if (qData.summary && qData.summary.earlierPatientsList) {
            // Agar oldingi kundan yo'naltirilib bugun tasdiqlangan bo'lsa
            allCompletedPatients = qData.summary.earlierPatientsList.filter(p => 
              (p.room === doc.room || p.doctorName === doc.doctorName) && (p.isConfirmedToday || p.statusCode === 8)
            );
          }
        } else {
          // Barcha shifokorlar bo'yicha qidirish
          if (qData.summary && qData.summary.earlierPatientsList) {
            allCompletedPatients = qData.summary.earlierPatientsList.filter(p => p.isConfirmedToday || p.statusCode === 8);
          }
        }

        updateStats();
        renderTable();
      }

      function updateStats() {
        const total = allCompletedPatients.length;
        const todayReg = allCompletedPatients.filter(p => p.isRegToday).length;
        const earlierReg = allCompletedPatients.filter(p => p.isRegEarlier || p.isRegYesterday).length;

        statPillTotal.textContent = `✅ Jami: ${total} ta`;
        statPillToday.textContent = `📅 Bugun ro'yxat: ${todayReg} ta`;
        statPillEarlier.textContent = `🔄 Oldin yo'naltirilgan: ${earlierReg} ta`;
        statPillEarlier.style.display = earlierReg > 0 ? 'inline-flex' : 'none';
      }

      function renderTable() {
        let list = allCompletedPatients;

        // Filtr
        if (currentFilter === 'today') {
          list = list.filter(p => p.isRegToday);
        } else if (currentFilter === 'earlier') {
          list = list.filter(p => p.isRegEarlier || p.isRegYesterday);
        }

        // Qidiruv
        if (currentQuery) {
          const q = currentQuery.toLowerCase();
          list = list.filter(p => 
            (p.patientId && String(p.patientId).toLowerCase().includes(q)) ||
            (p.fullName && p.fullName.toLowerCase().includes(q)) ||
            (p.referringDoctor && p.referringDoctor.toLowerCase().includes(q))
          );
        }

        if (list.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="7" class="empty-state">
                <span class="empty-icon">📋</span>
                ${allCompletedPatients.length === 0 ? "Ushbu shifokor bugun hali bemor ko'rmagan yoki tasdiqlanmagan." : "Qidiruv bo'yicha hech qanday bemor topilmadi."}
              </td>
            </tr>
          `;
          return;
        }

        tableBody.innerHTML = list.map((p, idx) => {
          const isEarlier = p.isRegEarlier || p.isRegYesterday;
          const statusTag = isEarlier 
            ? `<span class="tag-earlier-completed">🔄 ${escapeHtml(p.dateTag || "Oldin yo'naltirilgan, bugun o'tgan")}</span>`
            : `<span class="tag-completed">✅ Bugun ko'rildi</span>`;

          const regDateTime = `${escapeHtml(p.registrationDate || '-')} ${escapeHtml(p.registrationTime || '')}`.trim();
          const confDateTime = p.confirmationDate ? `✅ ${escapeHtml(p.confirmationDate)} ${escapeHtml(p.confirmationTime || '')}` : '—';

          return `
            <tr>
              <td style="text-align: center;"><span class="badge-idx">${idx + 1}</span></td>
              <td><span class="badge-id">${escapeHtml(p.patientId || '-')}</span></td>
              <td><span class="patient-name">${escapeHtml(p.fullName || '-')}</span></td>
              <td><span class="refer-doc">${escapeHtml(p.referringDoctor || '-')}</span></td>
              <td><span class="time-cell">${regDateTime}</span></td>
              <td><span class="time-cell">${confDateTime}</span></td>
              <td>${statusTag}</td>
            </tr>
          `;
        }).join('');
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Hodisalar
      searchInput.addEventListener('input', (e) => {
        currentQuery = e.target.value.trim();
        clearSearchBtn.style.display = currentQuery ? 'block' : 'none';
        renderTable();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        currentQuery = '';
        clearSearchBtn.style.display = 'none';
        renderTable();
        searchInput.focus();
      });

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.getAttribute('data-filter');
          renderTable();
        });
      });

      if (btnPrint) {
        btnPrint.addEventListener('click', () => window.print());
      }

      // Dastlabki yuklash va har 4 soniyada yangilash
      loadData();
      setInterval(loadData, 4000);
    })();
  </script>
</body>
</html>
