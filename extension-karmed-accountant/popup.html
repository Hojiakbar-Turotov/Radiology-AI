<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karmed Xizmat Narxlari</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- TOP HEADER -->
    <header class="app-header">
      <div class="header-brand">
        <img src="icons/logo-onko.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <div class="brand-text">
          <h1>KARMED PREYSKURANT</h1>
          <span class="brand-subtitle">Rasmiy tibbiy xizmat tariflari va narxlari</span>
        </div>
      </div>
      <div class="header-stats">
        <span class="badge-total" id="totalServicesBadge">168 xizmat</span>
      </div>
    </header>

    <!-- SEARCH & CATEGORY BAR -->
    <div class="search-panel">
      <!-- Search Box -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Kod yoki nom bo'yicha qidiring (R157, miya, UTT, kontrast)..." 
          autocomplete="off"
          spellcheck="false"
          autofocus
        >
        <button type="button" id="clearSearchBtn" class="btn-clear-search" title="Tozalash">✕</button>
      </div>

      <!-- Tariff Switcher Bar -->
      <div class="tariff-switcher-bar" id="tariffSwitcherBar">
        <button type="button" class="tariff-btn active" data-tariff="rezident">🇺🇿 Rezident</button>
        <button type="button" class="tariff-btn" data-tariff="norezident">🌐 No Rezident</button>
        <button type="button" class="tariff-btn" data-tariff="sugurta">📄 Sug'urta / Order</button>
      </div>

      <!-- Categories Filter Tabs -->
      <div class="category-tabs" id="categoryTabs">
        <button type="button" class="tab-btn active" data-cat="ALL">Barchasi <span class="tab-count" id="count-ALL">168</span></button>
        <button type="button" class="tab-btn" data-cat="MRT">MRT <span class="tab-count" id="count-MRT">65</span></button>
        <button type="button" class="tab-btn" data-cat="MSKT">MSKT <span class="tab-count" id="count-MSKT">24</span></button>
        <button type="button" class="tab-btn" data-cat="Rentgen">Rentgen <span class="tab-count" id="count-Rentgen">40</span></button>
        <button type="button" class="tab-btn" data-cat="UTT">UTT <span class="tab-count" id="count-UTT">34</span></button>
        <button type="button" class="tab-btn" data-cat="EKG">EKG <span class="tab-count" id="count-EKG">3</span></button>
        <button type="button" class="tab-btn" data-cat="Boshqa">Boshqa <span class="tab-count" id="count-Boshqa">2</span></button>
      </div>

      <!-- Extra Filter Tags (Contrast, Injector) -->
      <div class="filter-subbar">
        <div class="filter-chips">
          <button type="button" class="chip-filter" id="toggleContrastFilter">💉 Kontrastli</button>
          <button type="button" class="chip-filter" id="toggleInjectorFilter">⚡ Injektorli</button>
        </div>
        <div class="filter-results-info" id="filterResultsInfo">168 ta xizmat</div>
      </div>
    </div>

    <!-- SERVICES LIST CONTAINER -->
    <main class="services-viewport" id="servicesViewport">
      <div class="services-list" id="servicesList">
        <!-- Rendered by JS -->
      </div>
    </main>

    <!-- STICKY FOOTER / CALCULATOR -->
    <footer class="calc-footer" id="calcFooter">
      <div class="calc-hint" id="calcHint">
        <span class="hint-icon">💡</span> Bir nechta xizmatni belgilab jami narxini hisoblang
      </div>
      <div class="calc-active" id="calcActive" style="display: none;">
        <div class="calc-left">
          <span class="calc-badge" id="calcCount">0 ta xizmat</span>
          <div class="calc-sum-wrap">
            <span class="calc-sum-lbl">Jami:</span>
            <span class="calc-sum-val" id="calcTotal">0 so'm</span>
          </div>
        </div>
        <div class="calc-actions">
          <button type="button" class="btn-calc-action btn-copy-calc" id="btnCopyCalc" title="Ro'yxat va jami summani nusxalash">
            📋 Nusxalash
          </button>
          <button type="button" class="btn-calc-action btn-reset-calc" id="btnResetCalc" title="Barcha belgilashlarni bekor qilish">
            ✕ Tozalash
          </button>
        </div>
      </div>
    </footer>

    <!-- TOAST NOTIFICATION -->
    <div class="toast-popup" id="toastPopup">Nusxalandi!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
