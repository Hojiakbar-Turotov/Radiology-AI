<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Vrach Qabuli va Chaqiruv</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="popup-container">
    
    <!-- HEADER -->
    <header class="popup-header">
      <div class="header-left">
        <div class="logo-box">🩺</div>
        <div>
          <h2>Vrach Qabuli & Navbat</h2>
          <p>Lokal Tarmoq (LAN) Tizimi</p>
        </div>
      </div>
      <button class="btn-settings-toggle" id="btnSettingsToggle" title="Server sozlamalari">⚙️</button>
    </header>

    <!-- SERVER SOZLAMALARI (Yashirin / Ochiluvchi) -->
    <section class="settings-panel" id="settingsPanel" style="display: none;">
      <label class="field-label">Lokal Server Manzili (Host IP):</label>
      <div class="input-row">
        <input type="text" id="serverUrlInput" placeholder="http://localhost:3000" class="input-text">
        <button id="btnSaveServerUrl" class="btn-sm btn-primary">Saqlash</button>
      </div>
      <div class="server-status" id="serverStatusBadge">
        <span class="status-dot"></span> <span id="serverStatusText">Tekshirilmoqda...</span>
      </div>
    </section>

    <!-- VRACH VA XONA TANLASH -->
    <section class="doctor-select-card">
      <label class="field-label">Sizning Qabul Xonangiz / Vrach:</label>
      <select id="doctorSelect" class="input-select">
        <option value="">Vrachni tanlang...</option>
      </select>
    </section>

    <!-- TEZKOR CHAQIRUV TUGMASI (Navbatdagi 1-bemorni chaqirish) -->
    <section class="quick-call-card">
      <button id="btnCallNext" class="btn-call-next" disabled>
        <span class="call-icon">📢</span>
        <div>
          <div class="call-btn-title">NAVBATDAGI BEMORNI CHAQIRISH</div>
          <div class="call-btn-sub" id="nextPatientPreview">Navbatda bemor yo'q</div>
        </div>
      </button>
    </section>

    <!-- TABS: Navbatdagilar & Qo'shish -->
    <div class="tab-buttons">
      <button class="tab-btn active" id="tabQueue" onclick="switchTab('queue')">Navbatdagi Bemorlar (<span id="queueCount">0</span>)</button>
      <button class="tab-btn" id="tabAdd" onclick="switchTab('add')">+ Bemor Qo'shish</button>
    </div>

    <!-- TAB 1: BEMORLAR RO'YXATI -->
    <section class="queue-list-section" id="queueSection">
      <div class="patient-cards-list" id="patientCardsList">
        <!-- Dinamik chiziladi -->
      </div>
    </section>

    <!-- TAB 2: YANGI BEMOR QO'SHISH -->
    <section class="add-patient-section" id="addSection" style="display: none;">
      <form id="addPatientForm" onsubmit="handleAddPatient(event)">
        <div class="form-group">
          <label class="field-label">Bemor F.I.Sh:</label>
          <input type="text" id="addPatientName" class="input-text" placeholder="Familiya Ism Sharif" required>
        </div>
        <div class="form-group">
          <label class="field-label">Bemor ID (Ixtiyoriy):</label>
          <input type="text" id="addPatientId" class="input-text" placeholder="Masalan: 53312">
        </div>
        <div class="form-group">
          <label class="field-label">Tekshiruv turi:</label>
          <input type="text" id="addService" class="input-text" placeholder="Masalan: Qorin bo'shlig'i UTT">
        </div>
        <div class="form-group-checkbox">
          <label><input type="checkbox" id="addIsContrast"> Kontrastli tekshiruv</label>
        </div>
        <button type="submit" class="btn-submit-add">Navbatga Qo'shish</button>
      </form>
    </section>

    <!-- FOOTER -->
    <footer class="popup-footer">
      <button id="btnClearQueue" class="btn-link-danger">Navbatni tozalash</button>
      <button id="btnRefresh" class="btn-link">🔄 Yangilash</button>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
