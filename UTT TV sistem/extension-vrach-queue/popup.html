<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Vrach Qabuli va Chaqiruv</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="popup-container">
    
    <!-- HEADER -->
    <header class="popup-header">
      <div class="header-left">
        <div class="logo-box">🩺</div>
        <div>
          <h2 id="txtHeaderTitle">Vrach Qabuli & Navbat</h2>
          <p id="txtHeaderSub">Lokal Tarmoq (LAN) Tizimi</p>
        </div>
      </div>
      <div style="display: flex; gap: 6px; align-items: center;">
        <select id="extLangSelect" class="lang-mini-select" onchange="changeExtLanguage(this.value)">
          <option value="uz">🇺🇿 UZ</option>
          <option value="ru">🇷🇺 RU</option>
          <option value="en">🇬🇧 EN</option>
          <option value="tr">🇹🇷 TR</option>
          <option value="kz">🇰🇿 KZ</option>
          <option value="tg">🇹🇯 TG</option>
        </select>
        <button class="btn-settings-toggle" id="btnSettingsToggle" title="Server sozlamalari">⚙️</button>
      </div>
    </header>

    <!-- SERVER SOZLAMALARI -->
    <section class="settings-panel" id="settingsPanel" style="display: none;">
      <label class="field-label" id="lblServerHost">Lokal Server Manzili (Host IP):</label>
      <div class="input-row">
        <input type="text" id="serverUrlInput" placeholder="http://localhost:3000" class="input-text">
        <button id="btnSaveServerUrl" class="btn-sm btn-primary">Saqlash</button>
      </div>
      <div class="server-status" id="serverStatusBadge">
        <span class="status-dot"></span> <span id="serverStatusText">Tekshirilmoqda...</span>
      </div>
    </section>

    <!-- VRACH VA XONA TANLASH -->
    <section class="doctor-select-card">
      <label class="field-label" id="lblDoctorSelect">Sizning Qabul Xonangiz / Vrach:</label>
      <select id="doctorSelect" class="input-select">
        <option value="">Vrachni tanlang...</option>
      </select>
    </section>

    <!-- TEZKOR CHAQIRUV TUGMASI -->
    <section class="quick-call-card">
      <button id="btnCallNext" class="btn-call-next" disabled>
        <span class="call-icon">📢</span>
        <div>
          <div class="call-btn-title" id="txtCallNextTitle">NAVBATDAGI BEMORNI CHAQIRISH</div>
          <div class="call-btn-sub" id="nextPatientPreview">Navbatda bemor yo'q</div>
        </div>
      </button>
    </section>

    <!-- TABS -->
    <div class="tab-buttons">
      <button class="tab-btn active" id="tabQueue" onclick="switchTab('queue')"><span id="txtTabQueue">Navbatdagi Bemorlar</span> (<span id="queueCount">0</span>)</button>
      <button class="tab-btn" id="tabAdd" onclick="switchTab('add')"><span id="txtTabAdd">+ Bemor Qo'shish</span></button>
    </div>

    <!-- TAB 1: BEMORLAR RO'YXATI -->
    <section class="queue-list-section" id="queueSection">
      <div class="patient-cards-list" id="patientCardsList">
        <!-- Dinamik chiziladi -->
      </div>
    </section>

    <!-- TAB 2: YANGI BEMOR QO'SHISH -->
    <section class="add-patient-section" id="addSection" style="display: none;">
      <form id="addPatientForm" onsubmit="handleAddPatient(event)">
        <div class="form-group">
          <label class="field-label" id="lblAddName">Bemor F.I.Sh:</label>
          <input type="text" id="addPatientName" class="input-text" placeholder="Familiya Ism Sharif" required>
        </div>
        <div class="form-group">
          <label class="field-label" id="lblAddId">Bemor ID (Ixtiyoriy):</label>
          <input type="text" id="addPatientId" class="input-text" placeholder="Masalan: 53312">
        </div>
        <div class="form-group">
          <label class="field-label" id="lblAddService">Tekshiruv turi:</label>
          <input type="text" id="addService" class="input-text" placeholder="Masalan: Qorin bo'shlig'i UTT">
        </div>
        <div class="form-group-checkbox">
          <label><input type="checkbox" id="addIsContrast"> <span id="lblAddContrast">Kontrastli tekshiruv</span></label>
        </div>
        <button type="submit" class="btn-submit-add" id="btnAddSubmit">Navbatga Qo'shish</button>
      </form>
    </section>

    <!-- FOOTER -->
    <footer class="popup-footer">
      <button id="btnClearQueue" class="btn-link-danger">Navbatni tozalash</button>
      <button id="btnRefresh" class="btn-link">🔄 Yangilash</button>
    </footer>

  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
