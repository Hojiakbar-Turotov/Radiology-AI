    <script>

        function sortTR(value) {
            return value.replace('Ç', 'CZ')
                .replace('Ğ', 'GZ')
                .replace('İ', 'IZ')
                .replace('Ö', 'OZ')
                .replace('Ş', 'SZ')
                .replace('Ü', 'UZ');
        }

        var InfoPanelSecili = false;
        var Page = (function () {

            function infoPanelSec() {
                if (InfoPanelSecili)
                    dm.InfoPanelSec(0, "", "", 0);
                else
                    GList.SecimYap(null, null).InfoPanelListesi(function (aPanel) {
                        dm.InfoPanelSec(aPanel.Id, aPanel.Ad, aPanel.Ip, aPanel.Port);
                    });
            }

            var grdHizmetlerShowHandler = function (toolTip, grid) {
                var view = grid.getView(),
                    //store = grid.getStore(),
                    record = view.getRecord(view.findItemByChild(toolTip.triggerElement)),
                    column = view.getHeaderByCell(toolTip.triggerElement),
                    data = record.get(column.dataIndex);
                toolTip.update(data);
            };

            function tanimFormuAc(aTuru, aBaslik) {
                WindowAc(aBaslik, 800, 600, "Tanimlar.aspx", { turu: aTuru });
            }

            function raporFormuAc() {

                if (App.hdnRaporlarTureGoreAcilmasin.getValue() != "T") {
                    if (App.grdHizmetler.sec.RbysRaporTuru != 0) {
                        MsgGoster('Bu bölüme genel rapor yazılamaz!');
                        return;
                    }
                }

                Rbys.BolumYetki.VarMi(App.grdHastalar.sec.RandevuTuru, Rbys.BolumYetki.Turler.FilmCikmadiysaRaporYazma,
                    function () {
                        if (App.grdHastalar.sec.FilmCikti === "T") {
                            raporFormu();
                        } else {
                            MsgGoster('Hastanın Filmi Çıkmadıysa Rapor Yazılamaz!');
                        }
                    },
                    function () {
                        dm.FaturaKesildiMi(App.grdHastalar.sec.RandevuTuru, App.grdHastalar.sec.YatPol, App.grdHastalar.sec.ProtokolNo, dmSuccess(function (kesildi) {
                            if (kesildi) {
                                MsgGoster('Hasta Dosyası Faturalandığından Üzerinde İşlem Yapamazsınız!');
                            }
                            else {
                                raporFormu();
                            }
                        }));

                    }, function () {
                        raporFormu();
                    });
            }

            function raporFormu() {
                Rbys.SonucRapor.GenelRaporAc(App.grdHastalar.sec.DosyaDurumu, App.grdHizmetler.sec.Id, App.grdHastalar.sec.RandevuTuru, function () { dm.HastaSatirSorgula(App.grdHastalar.sec.Id); dm.RaporKayitveOnayKontrolEt(App.grdHastalar.sec.Id); });
            }

            function raporBolumFormuAc() {
                if (App.grdHastalar.sec.DosyaDurumu <= 3)
                    MsgGoster("Hastayı kabul etmeden rapor yazamazsınız.");
                else
                    Rbys.BolumYetki.VarMi(App.grdHastalar.sec.RandevuTuru, Rbys.BolumYetki.Turler.FilmCikmadiysaRaporYazma,
                        function () {
                            Rbys.BolumYetki.VarMi(App.grdHastalar.sec.RandevuTuru, Rbys.BolumYetki.Turler.RaporAcilisindaAmeliyatSureleriKontrolEdilsin,
                                function () {
                                    dm.AmeliyatKaydiVarMi(App.grdHastalar.sec.Id, App.grdHastalar.sec.AmeliyatBaslangicTarihi || "", App.grdHastalar.sec.AmeliyatBitisTarihi || "", App.grdHastalar.sec.RaporCikti, dmSuccess(function (sonuc) {
                                        if (sonuc.Basarili) {
                                            if (App.grdHastalar.sec.FilmCikti === "T") {
                                                Rbys.SonucRapor.RaporFormuAc(App.grdHizmetler.sec.RbysRaporTuru, App.grdHizmetler.sec.Id, App.grdHastalar.sec.RandevuTuru, function () { dm.HastaSatirSorgula(App.grdHastalar.sec.Id); });
                                            } else {
                                                MsgGoster('Hastanın Filmi Çıkmadıysa Rapor Yazılamaz!');
                                            }
                                        }
                                        else {
                                            MsgGoster(sonuc.Mesaj, function () {
                                                WindowAc('Ameliyat Kayıt Penceresi', 470, 225, 'AmeliyatKayit.aspx', { dosyaId: App.grdHastalar.sec.Id });
                                            });
                                        }
                                    }));
                                },
                                function () {
                                    if (App.grdHastalar.sec.FilmCikti === "T") {
                                        Rbys.SonucRapor.RaporFormuAc(App.grdHizmetler.sec.RbysRaporTuru, App.grdHizmetler.sec.Id, App.grdHastalar.sec.RandevuTuru, function () { dm.HastaSatirSorgula(App.grdHastalar.sec.Id); });
                                    } else {
                                        MsgGoster('Hastanın Filmi Çıkmadıysa Rapor Yazılamaz!');
                                    }
                                });
                        },
                        function () {
                            Rbys.BolumYetki.VarMi(App.grdHastalar.sec.RandevuTuru, Rbys.BolumYetki.Turler.RaporAcilisindaAmeliyatSureleriKontrolEdilsin,
                                function () {
                                    dm.AmeliyatKaydiVarMi(App.grdHastalar.sec.Id, App.grdHastalar.sec.AmeliyatBaslangicTarihi || "", App.grdHastalar.sec.AmeliyatBitisTarihi || "", App.grdHastalar.sec.RaporCikti, dmSuccess(function (sonuc) {
                                        if (sonuc.Basarili) {
                                            Rbys.SonucRapor.RaporFormuAc(App.grdHizmetler.sec.RbysRaporTuru, App.grdHizmetler.sec.Id, App.grdHastalar.sec.RandevuTuru, function () { dm.HastaSatirSorgula(App.grdHastalar.sec.Id); });
                                        }
                                        else {
                                            MsgGoster(sonuc.Mesaj, function () {
                                                WindowAc('Ameliyat Kayıt Penceresi', 470, 225, 'AmeliyatKayit.aspx', { dosyaId: App.grdHastalar.sec.Id });
                                            });
                                        }
                                    }));
                                },
                                function () {
                                    Rbys.SonucRapor.RaporFormuAc(App.grdHizmetler.sec.RbysRaporTuru, App.grdHizmetler.sec.Id, App.grdHastalar.sec.RandevuTuru, function () { dm.HastaSatirSorgula(App.grdHastalar.sec.Id); });
                                });
                        });
            }

            function hizmetAktar() {
                SoruSor("Seçili hizmeti yeni dosyaya aktarmak istediğinizden emin misiniz?", function () {
                    dm.YeniLabDosyaOlustur((App.grdHastalar.sec.Id), (App.grdHizmetler.sec.Id));
                });
            }

            function hizmetSil() {
                SoruSor("Seçili hizmeti silmek istediğinizden emin misiniz?", function () {
                    dm.HizmetSonucuVarMi(App.grdHizmetler.sec.Id, dmSuccess(function (aSonuc) {
                        if (aSonuc) {
                            MsgGoster("Hizmet raporu yazılmıştır. Silinemez");
                        } else {
                            dm.HizmetSil(App.grdHastalar.sec.Id, App.grdHizmetler.sec.Id);;
                        }
                    }));
                });
            }

            function hizmetDegistir() {
                if (App.grdHastalar.sec.DosyaDurumu === 8) {
                    MsgGoster("Rapor onaylanmış hizmet değiştirilemez, onay iptal işlemi yapınız!")
                    return;
                }

                dm.HizmetSonucuVarMi(App.grdHizmetler.sec.Id, dmSuccess(function (aSonuc) {
                    if (aSonuc) {
                        MsgGoster("Hizmet raporu yazılmıştır. Değiştirilemez");
                    } else {
                        dm.HizmetDegistirKontrol(App.grdHastalar.sec.Id, dmSuccess(function (aSonuc) {
                            if (aSonuc.Basarili) {
                                dm.MukerrerlikKontroluYapma(App.grdHastalar.sec.RandevuTuru, dmSuccess(function (yapma) {
                                    if (!yapma) {
                                        MsgGoster('Mükererlikten dolayı sadece aynı SUT koduyla hizmet değiştirilebilir.', function () {
                                            GList.SecimYap(null, "Hizmet listesi bulunamadı").SutKodunaAitHizmetListesi(App.grdHastalar.sec.RandevuTuru, App.grdHizmetler.sec.KodAra, function (aHizmet) {
                                                dm.HizmetDegistir(App.grdHastalar.sec.Id, App.grdHizmetler.sec.Id, aHizmet.Id);
                                            });
                                        });
                                    }
                                    else {
                                        GList.SecimYap(null, "Hizmet listesi bulunamadı").HizmetListesi(App.grdHastalar.sec.RandevuTuru, function (aHizmet) {

            function disMonitorHastaCagir() {

                var altBolum = App.grdHastalar.sec.RandevuTuruAlt | 0;
                var odaId = App.grdHastalar.sec.OdaId | 0;

                var davetAltBolumSecim = function () {

                    if (altBolum > 0) {
                        davetOdaSecim();
                    }
                    else {
                        var lsBolumId = localStorage.getItem(Rbys.LocalStorage.VarsayilanAltBolumIcinBolumId);
                        var lsAltBolumId = localStorage.getItem(Rbys.LocalStorage.VarsayilanBolumAltBolumId);

                        if (!!lsBolumId && !!lLsAltBolumId && (App.grdHastalar.sec.RandevuTuru.toString() === lsBolumId.toString())) {
                            App.grdHastalar.sec.RandevuTuruAlt.setValue(lsAltBolumId);
                            BildirimGoster("Alt bölüm otomatik olarak atanmıştır..");
                            davetOdaSecim();
                        }

                        GList2.RandevuAltBolum(App.grdHastalar.sec.RandevuTuru).SecimYok("Alt Bölüm Seçimi Yapmadınız..! İşlem İptal edildi.").Ac(function (bolumAlt) {
                            altBolum = bolumAlt.Id;
                            davetOdaSecim();
                        });
                    }
                };

                var davetOdaSecim = function () {
                    Rbys.BolumYetki.VarMi(App.grdHastalar.sec.RandevuTuru, Rbys.BolumYetki.Turler.AltOdaSec,
                        function () {
                            GList2.RandevuAltIleOda(altBolum).SecimYok("Oda seçimi yapmanız zorunludur. İşlem iptal edildi!").Ac(function (oda) {
                                odaId = oda.Id;
                                disMonitorHastaCagir();
                            })
                        },
                        function () {
                            disMonitorHastaCagir();
                        });

                };

                var disMonitorHastaCagir = function () {
                    var lSure = disMonitorHastaBeklemeSuresiGetir();

                    if (altBolum > 0)
                        App.grdHastalar.sec.RandevuTuruAlt = altBolum;
                    if (odaId > 0)
                        App.grdHastalar.sec.OdaId = odaId;

                    dm.DisMonitorHastaCagir(App.grdHastalar.sec, lSure, dmSuccess(function (aKabulEtmekUygun) {
                        if (aKabulEtmekUygun)
                            SoruSor("Davete Gönderilen Hasta Dosyası Kabul Edilsin mi?", function () {
                                dosyaKabulEt();
                            });
                        dm.DisMonitorListeGuncelle();
                    }));
                };

                davetAltBolumSecim();
            }
