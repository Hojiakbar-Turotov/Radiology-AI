<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRT & MSKT Ro'yxatchi Paneli</title>
  <link rel="stylesheet" href="popup.css">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="popup-container">
    
    <!-- 1. LOGIN BO'LMAGAN HOLAT -->
    <div id="loginView" style="display: none;">
      <div class="popup-header">
        <div class="popup-title">
          <h3>🔒 Tizimga Kirish</h3>
          <p>MRT & MSKT Ro'yxatchi Paneli</p>
        </div>
      </div>

      <div class="card-box">
        <div class="form-row">
          <label for="loginOperatorSelect">Ro'yxatchi (Operator):</label>
          <select id="loginOperatorSelect">
            <option value="TB1">TB1 — Turatov Hojiakbar</option>
            <option value="TB2">TB2 — Saida'loxon Saidaxmadxonov</option>
            <option value="TB3">TB3 — Isfandiyor Xaydaraliyev</option>
          </select>
        </div>

        <div class="form-row">
          <label for="loginPassword">Kirish Paroli:</label>
          <input type="password" id="loginPassword" placeholder="Parol (standart: 15420)">
        </div>

        <div id="popupLoginError" class="error-msg" style="display: none;">
          ❌ Parol noto'g'ri!
        </div>

        <button type="button" class="btn-primary" id="btnDoPopupLogin">
          <i class="fa-solid fa-right-to-bracket"></i> Kirish
        </button>
      </div>
    </div>

    <!-- 2. LOGIN QILINGAN HOLAT (PROFIL, HOLAT & PAROL O'ZGARTIRISH) -->
    <div id="mainView" style="display: none;">
      <!-- Operator Header -->
      <div class="operator-bar">
        <div class="op-left">
          <div class="op-avatar" id="opAvatar">TB1</div>
          <div>
            <div class="op-name" id="opName">Turatov Hojiakbar</div>
            <div class="op-badge" id="opBadge">Operator (TB1)</div>
          </div>
        </div>
        <button class="btn-logout-icon" id="btnPopupLogout" title="Tizimdan chiqish">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>

      <!-- Kengaytma Holati (ON / OFF SWITCH) -->
      <div class="card-box status-card" id="extStatusCard">
        <div class="status-header">
          <span class="status-title"><i class="fa-solid fa-power-off"></i> Kengaytma Holati:</span>
          <span class="status-badge active" id="extStatusBadge">🟢 Faol</span>
        </div>
        <p class="status-desc" id="extStatusDesc">
          Kardelen tizimidan bemorlarni avtomatik aniqlash va navbatga yozish yoqilgan.
        </p>
        <button type="button" class="btn-toggle-ext active" id="btnToggleExt">
          <i class="fa-solid fa-pause"></i> Vaqtincha O'chirish (To'xtatish)
        </button>
      </div>

      <!-- Bugungi Statistika -->
      <div class="stat-box">
        <span><i class="fa-solid fa-clipboard-check"></i> Bugun yuborilgan bemorlar:</span>
        <strong id="opTodayCount">0 nafar</strong>
      </div>

      <!-- TB Ro'yxatchi Parolini O'zgartirish -->
      <div class="card-box">
        <h4><i class="fa-solid fa-key" style="color: #f59e0b;"></i> Parolni O'zgartirish</h4>
        
        <div class="form-row">
          <label>Amaldagi eski parol:</label>
          <input type="password" id="popOldPwd" placeholder="Eski parolni kiriting">
        </div>

        <div class="form-row">
          <label>Yangi parol:</label>
          <input type="password" id="popNewPwd" placeholder="Yangi parolni kiriting (min 3 ta belgi)">
        </div>

        <div class="form-row">
          <label>Yangi parolni takrorlang:</label>
          <input type="password" id="popConfirmPwd" placeholder="Yangi parolni qayta kiriting">
        </div>

        <div id="popPwdMsg" class="error-msg" style="display: none; padding: 6px; border-radius: 6px; text-align: center; margin-bottom: 6px;"></div>

        <button type="button" class="btn-primary" id="btnPopSavePwd" style="background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);">
          <i class="fa-solid fa-floppy-disk"></i> Parolni Saqlash
        </button>
      </div>

      <!-- Til Tanlash -->
      <div class="card-box" style="padding: 10px 12px;">
        <div class="form-row" style="margin-bottom: 0;">
          <label for="popupLangSelector" style="margin-bottom: 4px;"><i class="fa-solid fa-globe"></i> Chop etish va interfeys tili:</label>
          <select id="popupLangSelector">
            <option value="uz">🇺🇿 O'zbekcha</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="en">🇬🇧 English</option>
            <option value="kk">🇰🇿 Қазақша</option>
            <option value="tg">🇹🇯 Тоҷикӣ</option>
            <option value="tr">🇹🇷 Türkçe</option>
          </select>
        </div>
      </div>
    </div>

  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
