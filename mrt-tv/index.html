<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Respublika Radiologiya va Onkologiya Markazi | TV Tablo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/shared/manual-modal.css">
  <script src="/shared/failover.js"></script>
</head>
<body>
  <div class="tv-wrapper">
    <!-- Header -->
    <header class="tv-header" title="Butun ekranga chiqarish uchun ikki marta bosing">
      <div class="header-logo-section">
        <img src="/karmed-workspace/assets/logo-onko.png" alt="Markaz Logotipi" class="hospital-tv-logo">
        <div>
          <h1 class="clinic-title" id="tvClinicTitle">RESPUBLIKA RADIOLOGIYA VA ONKOLOGIYA MARKAZI</h1>
          <span class="sub-title">ELEKTRON AQLLI NAVBAT TIZIMI</span>
        </div>
      </div>

      <div class="live-datetime">
        <div class="clock-display" id="tvClock">12:00:00</div>
        <div class="date-display" id="tvDate">02-sentabr, 2026</div>
      </div>
    </header>

    <!-- Main Devices Columns Grid -->
    <main class="tv-devices-grid" id="tvDevicesGrid">
      <!-- Dynamic MRT 1, MRT 2, MSKT Columns -->
    </main>

    <!-- Footer Ticker -->
    <footer class="tv-footer">
      <div class="ticker-wrap">
        <div class="ticker-item">
          <i class="fa-solid fa-circle-info" style="color:#0284c7;"></i> 
          Hurmatli bemorlar! MRT tekshiruviga kirishdan avval barcha metall buyumlar, soat, tilla va elektron moslamalarni yechib qoldirishingizni so'raymiz.
        </div>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <button type="button" class="tv-action-pill" onclick="openDepartmentManual('tv_tablo')" title="TV Tablo o'quv qo'llanmasi">
          <i class="fa-solid fa-book-open"></i> Qo'llanma
        </button>
        <button type="button" class="tv-action-pill" id="btnTvFullscreen" onclick="toggleTvFullscreen()" title="To'liq butun ekranga chiqarish (F11 / Fullscreen)">
          <i class="fa-solid fa-expand" id="tvFsIcon"></i> <span id="tvFsText">Butun Ekran</span>
        </button>
        <button type="button" class="tv-action-pill" id="btnThemeToggle" onclick="toggleTvTheme()" title="Mavzuni almashtirish (Kunduzgi / Tungi)">
          <i class="fa-solid fa-sun" id="themeIcon"></i> <span id="themeText">Kunduzgi</span>
        </button>
        <button type="button" class="tv-action-pill" id="btnAudioToggle" title="Ovozni yoqish / o'chirish">
          <i class="fa-solid fa-volume-high"></i> Ovozli E'lon: Faol
        </button>
      </div>
    </footer>
  </div>

  <!-- Audio Chime -->
  <audio id="audioChime" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
  </audio>

  <script src="/shared/manual-modal.js"></script>
  <script src="app.js"></script>
</body>
</html>
